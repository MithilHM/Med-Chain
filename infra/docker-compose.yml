version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medchain_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medchain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medchain_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-medchain_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medchain_user} -d ${POSTGRES_DB:-medchain_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: medchain_mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-medchain}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-medchain_mongo_pass}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username '${MONGO_ROOT_USERNAME:-medchain}' --password '${MONGO_ROOT_PASSWORD:-medchain_mongo_pass}' --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.18-community
    container_name: medchain_neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-medchain_graph_pass}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-medchain_graph_pass} 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  hardhat:
    build:
      context: ../contracts
      dockerfile: Dockerfile
    container_name: medchain_hardhat
    restart: always
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'eth_getCode',params:['0x5FbDB2315678afecb367f032d93F642f64180aa3','latest'],id:1})}).then(r=>r.json()).then(x=>process.exit(x.result&&x.result!=='0x'?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: medchain_api
    restart: always
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medchain_user}:${POSTGRES_PASSWORD:-medchain_secret_pass}@postgres:5432/${POSTGRES_DB:-medchain_db}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-medchain_user}:${POSTGRES_PASSWORD:-medchain_secret_pass}@postgres:5432/${POSTGRES_DB:-medchain_db}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-medchain}:${MONGO_ROOT_PASSWORD:-medchain_mongo_pass}@mongodb:27017/?authSource=admin
      NEO4J_URI: bolt://neo4j:7687
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
      # Trust X-Forwarded-For from the web container so sign-in limits apply per user, not per proxy.
      # Safe here only because this port is bound to localhost; see docs/OPERATIONS.md for real deployments.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      hardhat:
        condition: service_healthy

  # Real-time HL7 v2 listener for a hospital interface engine. Start with:
  #   docker compose -f infra/docker-compose.yml --profile integration up -d
  # Expose it only on the interface VPN/private network, and configure MLLP_TLS_* for TLS/mTLS.
  mllp:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: medchain_mllp
    profiles: ["integration"]
    restart: always
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medchain_user}:${POSTGRES_PASSWORD:-medchain_secret_pass}@postgres:5432/${POSTGRES_DB:-medchain_db}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-medchain_user}:${POSTGRES_PASSWORD:-medchain_secret_pass}@postgres:5432/${POSTGRES_DB:-medchain_db}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-medchain}:${MONGO_ROOT_PASSWORD:-medchain_mongo_pass}@mongodb:27017/?authSource=admin
      NEO4J_URI: bolt://neo4j:7687
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
      MLLP_HOST: 0.0.0.0
      OUTBOX_WORKER_ENABLED: "false"
    command: ["python", "-m", "src.integration.mllp_server"]
    ports:
      - "127.0.0.1:2575:2575"
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    container_name: medchain_web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
